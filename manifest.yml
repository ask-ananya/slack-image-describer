display_information:
  name: Image Describer
  description: Describes images in Slack threads for blind and low-vision users
  background_color: "#3C3489"
features:
  bot_user:
    display_name: Image Describer
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - files:read
      - channels:history
      - groups:history
      - im:history
      - mpim:history
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
